# Omakase Ruby styling for Rails. rubocop-performance and rubocop-rails are
# loaded by the omakase config; we add rubocop-rspec for spec files.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

# Merge our Exclude entries with the ones omakase already defines.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "vendor/**/*"

# House style: allow lines up to 120 characters.
Layout/LineLength:
  Enabled: true
  Max: 120

# Specs routinely set up a scenario and assert several related things; these
# defaults are stricter than how we write tests.
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
# The `expect(...).to receive` mocking style is fine; don't force spies.
RSpec/MessageSpies:
  Enabled: false
