#   8:M76 1ºC/2ºF  9:M78 2ºE/2ºI 10:M79 1ºA/3º  11:M80 1ºL/3º
#  12:M86 1ºJ/2ºH 13:M88 2ºD/2ºG 14:M85 1ºB/3º  15:M87 1ºK/3º
