# Round-of-32 canonical VERTICAL order for the FIFA World Cup 2026 (Tournament
# external_code "WC"). Official bracket data (verified).
#
# `order` is the bracket_position (top-to-bottom drawing order), derived from the
# knockout TREE, NOT the FIFA match number: the two R32 matches that feed the
# same R16 are adjacent (e.g. M74 and M77 both feed R16 M89 -> orders 0 and 1).
# The builder anchors each R32 match to its slot by the group positions of its
# teams; later rounds derive their order from the feeds_into graph. A "vs best
# third" side is `{ position: 3 }` with no group — the third's identity (Annex C)
# does not affect the ORDER. The builder logs a visible warning if these
# positions ever disagree with the matches football-data publishes.
#
# Slot -> FIFA match (sides as in the official draw):
#   0:M74 1ºE/3º   1:M77 1ºI/3º   2:M73 2ºA/2ºB  3:M75 1ºF/2ºC
