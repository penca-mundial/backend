# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  match_sync:
    class: MatchSyncJob
    queue: sync
    schedule: every 60 seconds
  standings_sync:
    # Group standings change only as matches finish. Every 10 minutes is frequent
    # enough during live windows yet light on the 10 req/min quota (the client's
    # 5-minute response cache absorbs bursts).
    class: StandingsSyncJob
    queue: sync
    schedule: every 10 minutes
