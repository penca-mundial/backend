# Spanish translations — the default locale. User-facing strings live here.
es:
  errors:
    not_found: "Recurso no encontrado."
    standard_error: "Ocurrió un error inesperado."
    unauthorized: "Necesitás iniciar sesión para continuar."
    forbidden: "No tenés permisos para esta acción."
    # Keys referenced by controllers, concerns, and services.
    record_not_found: "Recurso no encontrado."
    validation_failed: "Los datos enviados no son válidos."
    unauthenticated: "Necesitás iniciar sesión para continuar."
    account_banned: "Tu cuenta fue suspendida."
    admin_required: "No tenés permisos para esta acción."
  services:
    errors:
      record_not_found: "Recurso no encontrado."
    groups:
      not_found: "El grupo no existe o el código es inválido."
      not_owner: "Solo el dueño del grupo puede realizar esta acción."
      owner_cannot_leave: "El dueño no puede abandonar su propio grupo."
      cannot_delete_general_pool: "No se puede eliminar la liga general."
      cannot_kick_owner: "No se puede expulsar al dueño del grupo."
      not_a_member: "El usuario no es integrante del grupo."
  activerecord:
    # Attribute names used as the prefix of validation full messages
    # ("Contraseña apareció en…"). Without these the prefix renders in English.
    attributes:
      user:
        password: "Contraseña"
    errors:
      models:
        user:
          attributes:
            password:
              missing_digit: "debe contener al menos un número"
              # devise-pwned_password ships only an :en message; without this
              # key production (es) rendered the raw "Translation missing…"
              # fallback. Reads after the attribute: "Contraseña apareció en…".
              pwned_password: "apareció en filtraciones de datos conocidas. Elegí una contraseña distinta."
        match:
          attributes:
            advancing_team_id:
              not_a_participant: "debe ser uno de los equipos del partido"
              not_in_group_stage: "no se permite en la fase de grupos"
        group:
          attributes:
            base:
              too_many_owned_groups: "no podés tener más de 3 grupos activos"
        group_membership:
          attributes:
            base:
              group_full: "el grupo alcanzó el máximo de integrantes"
              cannot_leave_general_pool: "no se puede abandonar la liga general"
        prediction:
          attributes:
            predicted_advancing_team_id:
              required: "es obligatorio en partidos de eliminación"
              not_a_participant: "debe ser uno de los equipos del partido"
        tournament_prediction:
          not_in_tournament: "no pertenece al torneo"
          attributes:
            base:
              duplicate_podium: "los cuatro puestos del podio deben ser equipos distintos"
