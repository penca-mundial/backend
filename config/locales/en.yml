# English translations. User-facing strings default to Spanish (see es.yml);
# English is the fallback locale.
en:
  # Human labels for the public scoring config endpoint (GET /scoring_rules).
  scoring:
    rule_types:
      exact_score: "Exact score"
      correct_goal_difference: "Correct goal difference"
      correct_winner: "Correct result (winner or draw)"
      correct_advance: "Correct team to advance"
      champion_correct: "Correct champion"
      runner_up_correct: "Correct runner-up"
      third_place_correct: "Correct third place"
      fourth_place_correct: "Correct fourth place"
      top_scorer_correct: "Correct top scorer"
    phases:
      group_stage: "Group stage"
      round_of_32: "Round of 32"
      round_of_16: "Round of 16"
      quarter_final: "Quarter-final"
      semi_final: "Semi-final"
      third_place: "Third place"
      final: "Final"
  errors:
    not_found: "Resource not found."
    standard_error: "Something went wrong."
    unauthorized: "You need to sign in to continue."
    forbidden: "You don't have permission to do that."
    # Keys referenced by controllers, concerns, and services.
    record_not_found: "Resource not found."
    validation_failed: "The submitted data is invalid."
    unauthenticated: "You need to sign in to continue."
    account_banned: "Your account has been suspended."
    admin_required: "You don't have permission to do that."
  services:
    errors:
      record_not_found: "Resource not found."
    groups:
      not_found: "The group does not exist or the code is invalid."
      not_owner: "Only the group owner can perform this action."
      owner_cannot_leave: "The owner cannot leave their own group."
      cannot_delete_general_pool: "The general pool cannot be deleted."
      cannot_kick_owner: "The group owner cannot be removed."
      not_a_member: "That user is not a member of the group."
  activerecord:
    # Attribute names mirrored from es.yml so the English fallback reads cleanly.
    attributes:
      user:
        email: "Email"
        username: "Username"
        password: "Password"
    errors:
      models:
        user:
          attributes:
            password:
              missing_digit: "must contain at least one number"
              pwned_password: "has appeared in known data breaches. Please choose a different password."
        match:
          attributes:
            advancing_team_id:
              not_a_participant: "must be one of the teams playing the match"
              not_in_group_stage: "is not allowed during the group stage"
        group:
          attributes:
            base:
              too_many_owned_groups: "cannot own more than 3 active groups"
        group_membership:
          attributes:
            base:
              group_full: "has reached its maximum number of members"
              cannot_leave_general_pool: "cannot be removed from the general pool"
        prediction:
          attributes:
            predicted_advancing_team_id:
              required: "is required for knockout matches"
              not_a_participant: "must be one of the teams playing the match"
        tournament_prediction:
          not_in_tournament: "does not belong to the tournament"
          attributes:
            base:
              duplicate_podium: "the four podium spots must be distinct teams"
