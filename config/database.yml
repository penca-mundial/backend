# PostgreSQL configuration.
#
# DATABASE_URL is the source of truth for the connection. In development and
# test it falls back to a local connection when DATABASE_URL is unset, so the
# app still boots without any env configuration. Under docker-compose the host
# is the `db` service (see docker-compose.yml).
#
# https://guides.rubyonrails.org/configuring.html#configuring-a-database
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://localhost/penca_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://localhost/penca_test") %>

# Production uses separate databases for the primary data and the Solid Queue /
# Cache / Cable backends. The production deploy ticket wires these to Render.
production:
  primary: &primary_production
    <<: *default
    database: backend_production
    username: backend
    password: <%= ENV["BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: backend_production_cable
    migrations_paths: db/cable_migrate
